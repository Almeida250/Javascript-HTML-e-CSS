     function contarPalavras(string) {
      const resultado = {};

      for (i=0;i < string.length; i++) {
        const palavra = string[i];

        if (!resultado[palavra]) {
          resultado[palavra]=1;
        } else {
          resultado[palavra]++;
        }
      }
      
      return resultado;
     }
