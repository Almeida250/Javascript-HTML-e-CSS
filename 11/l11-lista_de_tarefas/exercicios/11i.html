  <body>
    <script> 

      function fizzBuzz() {

          for(let i = 0; i <= 20;i++) {

          if(i % 3 === 0 && i % 5 === 0) {
            console.log("FizzBuzz");

          } else if (i % 3 === 0) {
            console.log("Fizz");

          } else if (i % 5 === 0) {
            console.log("Buzz");

          } else {
            console.log(i);
          }
        }
      } 

      console.log(fizzBuzz());
    </script>
  </body>
