<!DOCTYPE html>
<html>
  <head>
    <!--resolva o problema de FizzBuzz. Crie um loop que conta de 1 até 20 no console. Se o numero que aparecer for divisível por 3, mostre no console "Fizz". Se o numero que aparecer for divisível por 5, mostre "Buzz". Se for divisível por 3 e também por 5, mostre "FizzBuzz. ex: 1,2,Fizz,4, Buzz, Fizz, 7, 8... 13, 14, FizzBuzz, 16, 17" -->
  </head>
  <body>
    <script> 

      function fizzBuzz() {

          for(let i = 1; i <= 20;i++) {

          if(i % 3 === 0 && i % 5 === 0) {
            console.log("FizzBuzz");

          } else if (i % 3 === 0) {
            console.log("Fizz");

          } else if (i % 5 === 0) {
            console.log("Buzz");

          } else {
            console.log(i);
          }
        }
      } 

      console.log(fizzBuzz());
    </script>
  </body>
</html>
