<!DOCTYPE html>
<html>
  <head>
  <!--Continuando do 12h:
    Não deixar 'nMensagen' passar de 0-->
  <title>App</title>
  </head>
  <body>
    <button onclick="
      nMensagen++;
      mostrarNotificacao();
    ">Adicionar</button>

    <button onclick="
      if (nMensagen > 0) {
        nMensagen--;

        if (nMensagen === 0) {
          pararNotificacao();
        }
      }"
    >Remover</button>

    <script>
      let intervaloId;

      let estaMostrandoNotificacao;

      let nMensagen = 2;

      function mostrarNotificacao() {
        if (estaMostrandoNotificacao) {
          return; // Sai da função se a notificação já estiver sendo exibida
        }

        estaMostrandoNotificacao = true; // Define como true após a verificação

        intervaloId = setInterval(function() {
          if (document.title === 'App') {
            document.title = `(${nMensagen }) novas mensagens`;
          } else {
            document.title = 'App';
          }
        }, 1000);
      }

      mostrarNotificacao();

      function pararNotificacao() {
        estaMostrandoNotificacao = false;

        clearInterval(intervaloId);
        document.title = 'App'
      }
      
      
    </script>
  </body>
</html>
