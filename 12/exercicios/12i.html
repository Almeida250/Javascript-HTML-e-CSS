<!DOCTYPE html>
<html>
  <head>
  <!--Continuando do 12h:
    Não deixar 'nMensagen' passar de 0-->
  <title>App</title>
  </head>
  <body>
    <button class="adicionar">Adicionar</button>

    <button class="remover">Remover</button>

    <script>
      let intervaloId;

      let estaMostrandoNotificacao;

      let nMensagen = 2;

      document.querySelector('.adicionar')
        .addEventListener('click', () => {
          nMensagen++;
          mostrarNotificacao();
        })
      document.querySelector('.remover')
        .addEventListener('click', () => {
          if (nMensagen > 0) {
            nMensagen--;

            if (nMensagen === 0) {
              pararNotificacao();
            }
          }
        })

      const mostrarNotificacao = () => {
        if (estaMostrandoNotificacao) {
          return; // Sai da função se a notificação já estiver sendo exibida
        }

        estaMostrandoNotificacao = true; // Define como true após a verificação

        intervaloId = setInterval(() => {
          if (document.title === 'App') {
            document.title = `(${nMensagen }) novas mensagens`;
          } else {
            document.title = 'App';
          }
        }, 1000);
      }

      mostrarNotificacao();

      function pararNotificacao() {
        estaMostrandoNotificacao = false;

        clearInterval(intervaloId);
        document.title = 'App'
      }
      
      
    </script>
  </body>
</html>
