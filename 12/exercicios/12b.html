<!DOCTYPE html>
<html>
  <head>
  <!--Continuando do exercício 12a, crie uma função duasVezes() onde ele pega uma função como parámetro e rode ela duas vezes
      duasVezes(adicionar) => console.log(5) duas vezes-->
  </head>
  <body>
    <script>
      const adicionar = function() {
        console.log(2+3);
      }

      function duasVezes(funcao) {
        funcao();
        funcao();
      }

      duasVezes(function() {
        console.log('teste');
      })

      duasVezes(adicionar);
    </script>
  </body>
</html>
