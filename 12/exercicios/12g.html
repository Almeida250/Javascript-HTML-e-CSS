<!DOCTYPE html>
<html>
  <head>
    <!--Crie uma simulação de aplicativo de mensagens. use setInterval() e document.tile para criar uma feature onde o titulo do site mude a cada 1 segundo
    EXERCICIO 12p: Atualizando as funções de exercícios anteriores, transformando elas em arrow functions -->
    <title>App</title>
  </head>
  <body>
    <script>
      setInterval(() => {
        if (document.title === 'App') {
          document.title = '(2) novas mensagens';
        } else {
          document.title = 'App';
        }
      }, 1000);
    </script>
  </body>
</html>
