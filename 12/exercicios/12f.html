<!DOCTYPE html>
<head>
<!--Continuando do 12e,se a gente clicar no botão, esperar 1 ou 1.5 segundos, e clicar no botão denovo, percebe-se que na segunda vez, a mensagem desaparece muito rápido (por que o primeiro setTimeout ainda estava rodando e fazia com que a mensagem desaparecesse muito rapido)
Modifique o código para que quando a gente clicar no botão, ele da um 'refresh' de 2 segundos de espera (espere por 2 segundos DENOVO e ai remove a mensagem)-->
</head>
  <body>
    <button class="botao" onclick="mudarTexto();
    ">Adicionar ao carrinho</button>

    <p class="texto"></p>

    <script>
      let timeoutId;
      function mudarTexto () {
        const texto = document.querySelector('.texto');
        texto.innerHTML = 'Adicionado!'; 

        clearTimeout(timeoutId);

        timeoutId = setTimeout(function() {
          texto.innerHTML = '';
        }, 2000)
      }
    </script>
  </body>
