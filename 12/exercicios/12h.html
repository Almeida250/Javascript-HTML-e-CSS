<!DOCTYPE html>
<html>
  <head>
  <!--Continuando do 12g, crie dois botões (Adicionar e remover mensagens) onde ao serem clicados, eles mudam o titulo da página-->
  <title>App</title>
  </head>
  <body>
    <button onclick=
    nMensagen++;
    >Adicionar</button>

    <button onclick=
    nMensagen--; 
    >Remover</button>
    <script>
      let nMensagen = 2

      setInterval(function() {
        if (document.title === 'App') {
          document.title = `(${nMensagen })novas mensagens`;
        } else {
          document.title = 'App';
        }
      }, 1000);
      
    </script>
  </body>
</html>
