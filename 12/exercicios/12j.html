<!DOCTYPE html>
<html>
  <head>
  <!--Crie uma função tipo arrow com o nome 'multiplicar' onde pega 2 numeros,
  multiplique entre eles , e depois retorne o resultado-->
  </head>
  <body>
    <script>
        const multiplicacao = (a,b) => a * b;
        console.log(multiplicacao(2,3));
        console.log(multiplicacao(10,7));
    </script>
  </body>
</html>
