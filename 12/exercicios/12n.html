<html>
  <head>
      <!--Criar uma função 'removerOvo(comida) onde vai pegar um array de strings e vai retornar um array onde a string 'ovo'seja removida desse mesmo array usando .filter()-->
  </head>
  <body>
    <script>
      function removerOvo(comida) {
       return comida.filter(item => item !== 'ovo');
      }


      console.log(removerOvo(['arroz', 'ovo', 'bacon', 'ovo', 'frango']));
    </script>
  </body>
</html>
