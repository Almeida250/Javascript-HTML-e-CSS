<html>
  <head></head>
  <body>
    <script>
      function contarPositivos(numeros) {
        let numeroPositivo = 0;

        numeros.forEach((numero) => {
          if(numero > 0) {
            numeroPositivo ++;
          }
        });
        return numeroPositivo;
      }

      console.log(contarPositivos([2,3]));
      console.log(contarPositivos([30,5,0,1,-1]))
    </script>
  </body>
</html>
