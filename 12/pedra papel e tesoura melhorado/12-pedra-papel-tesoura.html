<!DOCTYPE html>
<html>
  <head>
    <title>Pedra Papel Tesoura</title>
    <link rel="stylesheet" href="12-pedra-papel-tesoura.css">
  </head>
  <body>
    <p class="titulo">Pedra Papel e Tesoura</p>
    <button class="botao-escolha js-botao-pedra">
    <img src="/img/rock-emoji.png"  class="icone-escolha"></button>

    <button class="botao-escolha js-botao-papel">
    <img src="/img/paper-emoji.png" class="icone-escolha"></button>

    <button class="botao-escolha js-botao-tesoura">
    <img src="/img/scissors-emoji.png" class="icone-escolha"></button>


    <p class="js-resultado resultado"></p>
    <p class="js-escolha"></p>
    <p class="js-pontuacao pontuacao"></p>


    <button class="botao-zerar-pontuacao">Zerar Pontuação</button>

    <button class="botao-auto-play">Auto Play</button>

    <div class="confirmar-zerar-pontuacao js-confirmar-zerar-pontuacao" >
      <p>Tem certeza que deseja zerar a pontuação?</p>
      <button class="botao-zerar-sim botao-zerar-pontuacao">Sim</button>
      <button class="botao-zerar-nao botao-zerar-pontuacao">Não</button>
    </div>

    <script src="12-pedra-papel-tesoura.js"></script>
  </body>
</html>
